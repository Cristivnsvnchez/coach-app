<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TrackMe · Strava</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f0ea; --card: #fff; --ink: #141418; --ink2: #5e5a52; --btn: #1b3fd1; --fill: rgba(60,56,48,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #12110f; --card: #1d1b18; --ink: #f4f1ea; --ink2: #b3ada2; --btn: #5b7bff; --fill: rgba(244,241,234,.1); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 28px; padding: 28px 22px; text-align: center; box-shadow: 0 1px 2px rgba(30,24,16,.06); }
  h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -.02em; }
  p { margin: 8px 0; color: var(--ink2); }
  .code { margin: 18px 0; padding: 18px 10px; border-radius: 20px; background: var(--fill); color: var(--ink);
    font: 600 1.7rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; word-break: break-all; user-select: all; -webkit-user-select: all; }
  button { appearance: none; border: 0; width: 100%; min-height: 56px; border-radius: 28px; background: var(--btn); color: #fff; font: 600 1.05rem -apple-system, system-ui, sans-serif; cursor: pointer; }
  button:active { opacity: .7; }
  .err { color: #c92a2a; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="body"></div>
</main>
<script>
(function () {
  var L = ((navigator.language || 'fr').slice(0, 2));
  var T = {
    fr: { ok: 'Autorisation reçue', go: 'Reviens dans TrackMe et colle ce code.', copy: 'Copier', copied: 'Copié', bad: 'Autorisation refusée', badp: 'Tu as refusé l’accès à Strava. Reviens dans TrackMe et recommence si tu veux te connecter.', none: 'Aucun code reçu', nonep: 'Cette page s’ouvre depuis Strava après l’autorisation. Reviens dans TrackMe et appuie sur « Autoriser ».', scope: 'Pense à laisser cochée la lecture de tes activités.' },
    en: { ok: 'Authorization received', go: 'Go back to TrackMe and paste this code.', copy: 'Copy', copied: 'Copied', bad: 'Authorization refused', badp: 'You declined access to Strava. Go back to TrackMe and try again if you want to connect.', none: 'No code received', nonep: 'This page opens from Strava after you authorize. Go back to TrackMe and tap “Authorize”.', scope: 'Remember to keep the activity read permission ticked.' },
    nl: { ok: 'Autorisatie ontvangen', go: 'Ga terug naar TrackMe en plak deze code.', copy: 'Kopiëren', copied: 'Gekopieerd', bad: 'Autorisatie geweigerd', badp: 'Je hebt de toegang tot Strava geweigerd. Ga terug naar TrackMe en probeer opnieuw als je wilt koppelen.', none: 'Geen code ontvangen', nonep: 'Deze pagina opent vanuit Strava na autorisatie. Ga terug naar TrackMe en tik op “Autoriseren”.', scope: 'Laat het lezen van je activiteiten aangevinkt.' }
  };
  var s = T[L] || T.fr;
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), err = q.get('error');
  var title = document.getElementById('title'), body = document.getElementById('body');
  function p(text, cls) { var e = document.createElement('p'); e.textContent = text; if (cls) e.className = cls; body.appendChild(e); }
  if (err || !code) {
    title.textContent = err ? s.bad : s.none;
    p(err ? s.badp : s.nonep, err ? 'err' : '');
    return;
  }
  document.documentElement.lang = L;
  title.textContent = s.ok;
  p(s.go);
  var c = document.createElement('div'); c.className = 'code'; c.textContent = code; body.appendChild(c);
  var b = document.createElement('button'); b.textContent = s.copy; body.appendChild(b);
  if (q.get('scope') && q.get('scope').indexOf('activity:read') < 0) p(s.scope, 'err');
  b.onclick = function () {
    function done() { b.textContent = s.copied; setTimeout(function () { b.textContent = s.copy; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, sel);
    else sel();
    function sel() { var r = document.createRange(); r.selectNodeContents(c); var g = getSelection(); g.removeAllRanges(); g.addRange(r); try { document.execCommand('copy'); done(); } catch (e) {} }
  };
})();
</script>
</body>
</html>
